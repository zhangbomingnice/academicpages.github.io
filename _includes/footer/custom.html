{% include base_path %}
{% assign visitor_map = site.data.visitor_map %}

<!-- start custom footer snippets -->

<a href="{{ base_path }}/sitemap/">Sitemap</a>

<!-- Support for MatJax -->
<script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>

{% if visitor_map.provider == "umami" and visitor_map.tracking and visitor_map.tracking.enabled and visitor_map.tracking.script_url and visitor_map.tracking.website_id %}
<script
  defer
  src="{{ visitor_map.tracking.script_url }}"
  data-website-id="{{ visitor_map.tracking.website_id }}"
  {% if visitor_map.tracking.host_url %}data-host-url="{{ visitor_map.tracking.host_url }}"{% endif %}
  {% if visitor_map.tracking.domains %}data-domains="{{ visitor_map.tracking.domains }}"{% endif %}
></script>
{% endif %}

<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>

<!-- end custom footer snippets -->
